name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run setup:gitleaks
      - run: npm run scan:secrets
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:security
      - name: Install Linux secure storage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-keyring libsecret-tools dbus-x11
      - name: Check Linux account keys
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            export XDG_DATA_HOME="$(mktemp -d)"
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            npm run test:linux-keys
          '
